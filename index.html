<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>值班看板</title>
<style>
  :root{
    --bg:#0e1014; --card:#171a21; --line:#282d38; --txt:#e8ebf0;
    --dim:#8b93a1; --accent:#4f9cf9; --weekend:#e8a35e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:840px;margin:0 auto;padding:26px 16px 56px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:22px}
  h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.4px}
  .sub{color:var(--dim);font-size:12.5px;text-align:right}

  .hero{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 18px}
  .card .tag{font-size:12px;color:var(--dim);letter-spacing:2px}
  .card .name{font-size:29px;font-weight:650;letter-spacing:1px;margin-top:4px;line-height:1.25}
  .card .date{font-size:12.5px;color:var(--dim);margin-top:3px}
  .card.today{border-color:rgba(79,156,249,.45);
    background:linear-gradient(180deg,rgba(79,156,249,.09),rgba(79,156,249,0) 70%),var(--card)}
  .card.today .name{color:#cfe3ff}

  h2{font-size:13px;font-weight:600;color:var(--dim);letter-spacing:2px;margin:0 0 10px}

  .week{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:28px}
  .row{display:grid;grid-template-columns:78px 1fr auto;align-items:center;gap:10px;
    padding:11px 16px;border-top:1px solid var(--line);font-size:14px}
  .row:first-child{border-top:0}
  .row .wd{color:var(--dim);font-size:13px}
  .row .nm{font-weight:550}
  .row .badge{font-size:11.5px;color:var(--accent);border:1px solid rgba(79,156,249,.4);
    border-radius:999px;padding:1px 8px}
  .row.is-today{background:rgba(79,156,249,.06)}
  .row.is-weekend .wd{color:var(--weekend)}

  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-head .m{font-size:15px;font-weight:600;letter-spacing:.5px}
  .nav{display:flex;gap:8px}
  .nav button{background:var(--card);color:var(--txt);border:1px solid var(--line);
    border-radius:9px;width:32px;height:30px;font-size:15px;line-height:1;cursor:pointer}
  .nav button:hover{border-color:var(--accent);color:var(--accent)}
  .cal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal-grid .hcell{text-align:center;font-size:11.5px;color:var(--dim);padding:5px 0 7px}
  .cal-grid .hcell.we{color:var(--weekend)}
  .cell{min-height:62px;border-radius:9px;padding:6px 5px 4px;background:#12151b;
    display:flex;flex-direction:column;gap:1px;overflow:hidden}
  .cell .d{font-size:11.5px;color:var(--dim);line-height:1.3}
  .cell .n{font-size:12.5px;font-weight:550;line-height:1.35;word-break:break-all}
  .cell.we{background:#161a21}
  .cell.we .d{color:var(--weekend)}
  .cell.past{opacity:.42}
  .cell.empty{background:transparent}
  .cell.today{border:1px solid rgba(79,156,249,.65);background:rgba(79,156,249,.10)}
  .cell.today .d{color:#9fc7ff}

  footer{margin-top:26px;color:var(--dim);font-size:12.5px;text-align:center;line-height:1.9}
  @media(max-width:520px){
    .card .name{font-size:24px}
    .cell{min-height:54px}
    .cell .n{font-size:11.5px}
    .row{grid-template-columns:64px 1fr auto;padding:10px 13px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>值班看板</h1>
    <div class="sub" id="coverage"></div>
  </header>

  <div class="hero">
    <div class="card today">
      <div class="tag">今天</div>
      <div class="name" id="t-name">—</div>
      <div class="date" id="t-date"></div>
    </div>
    <div class="card">
      <div class="tag">明天</div>
      <div class="name" id="m-name">—</div>
      <div class="date" id="m-date"></div>
    </div>
  </div>

  <h2>接下来一周</h2>
  <div class="week" id="week"></div>

  <h2>排班月历</h2>
  <div class="cal-head">
    <div class="m" id="cal-title"></div>
    <div class="nav">
      <button id="prev" aria-label="上个月">‹</button>
      <button id="next" aria-label="下个月">›</button>
    </div>
  </div>
  <div class="cal">
    <div class="cal-grid" id="cal-head"></div>
    <div class="cal-grid" id="cal" style="margin-top:5px"></div>
  </div>

  <footer id="foot"></footer>
</div>

<script type="application/json" id="roster">
{"2026-11-04":"张松","2026-11-05":"何吉星","2026-11-06":"漆仲喜","2026-11-07":"漆仲喜","2026-11-08":"何吉星","2026-11-09":"於洪军","2026-11-10":"张凯旋","2026-11-11":"何吉星","2026-11-12":"漆仲喜","2026-11-13":"於洪军","2026-11-14":"张凯旋","2026-11-15":"於洪军","2026-11-16":"张松","2026-11-17":"张凯旋","2026-11-18":"何吉星","2026-11-19":"漆仲喜","2026-11-20":"张松","2026-11-21":"张松","2026-11-22":"漆仲喜","2026-11-23":"於洪军","2026-11-24":"张凯旋","2026-11-25":"何吉星","2026-11-26":"漆仲喜","2026-11-27":"张松","2026-11-28":"於洪军","2026-11-29":"张凯旋","2026-11-30":"於洪军","2026-12-01":"张凯旋","2026-12-02":"何吉星","2026-12-03":"漆仲喜","2026-12-04":"张松"}
</script>
<script>
(function () {
  var roster = JSON.parse(document.getElementById('roster').textContent);
  var WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  var dates = Object.keys(roster).sort();

  function parts(s) { var p = s.split('-'); return [Number(p[0]), Number(p[1]), Number(p[2])]; }
  function dow(s) { var p = parts(s); return new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay(); }
  function addDays(s, n) {
    var p = parts(s);
    return new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)).toISOString().slice(0, 10);
  }
  function todayStr() {
    return new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit'
    }).format(new Date());
  }
  function md(s) { return s.slice(5).replace('-', '/'); }
  function nameOf(s) { return roster[s] || ''; }

  var today = todayStr();
  var tomorrow = addDays(today, 1);

  function setCard(nameEl, dateEl, d) {
    nameEl.textContent = nameOf(d) || '未排班';
    dateEl.textContent = md(d) + ' ' + WD[dow(d)];
  }
  setCard(document.getElementById('t-name'), document.getElementById('t-date'), today);
  setCard(document.getElementById('m-name'), document.getElementById('m-date'), tomorrow);

  // 接下来一周
  var week = document.getElementById('week');
  for (var i = 0; i < 7; i++) {
    var d = addDays(today, i);
    var w = dow(d);
    var row = document.createElement('div');
    row.className = 'row' + (i === 0 ? ' is-today' : '') + ((w === 0 || w === 6) ? ' is-weekend' : '');
    var badge = i === 0 ? '<span class="badge">今天</span>'
              : i === 1 ? '<span class="badge">明天</span>' : '';
    row.innerHTML =
      '<div class="wd">' + WD[w] + '</div>' +
      '<div class="nm">' + (nameOf(d) || '<span style="color:var(--dim)">未排班</span>') + '</div>' +
      '<div>' + badge + '<span style="color:var(--dim);font-size:12.5px;margin-left:8px">' + md(d) + '</span></div>';
    week.appendChild(row);
  }

  // 月历
  var head = document.getElementById('cal-head');
  for (var j = 1; j <= 7; j++) {
    var h = document.createElement('div');
    var we = (j === 1 || j === 7);
    h.className = 'hcell' + (we ? ' we' : '');
    h.textContent = WD[j % 7];
    head.appendChild(h);
  }

  var view = { y: Number(today.slice(0, 4)), m: Number(today.slice(5, 7)) };
  var cal = document.getElementById('cal');
  var title = document.getElementById('cal-title');

  function render() {
    title.textContent = view.y + ' 年 ' + view.m + ' 月';
    cal.innerHTML = '';
    var first = new Date(Date.UTC(view.y, view.m - 1, 1)).getUTCDay();
    var offset = (first + 6) % 7;                       // 周一为一周起点
    var days = new Date(Date.UTC(view.y, view.m, 0)).getUTCDate();

    for (var k = 0; k < offset; k++) {
      var e = document.createElement('div');
      e.className = 'cell empty';
      cal.appendChild(e);
    }
    for (var day = 1; day <= days; day++) {
      var s = view.y + '-' + String(view.m).padStart(2, '0') + '-' + String(day).padStart(2, '0');
      var w = dow(s);
      var c = document.createElement('div');
      c.className = 'cell'
        + ((w === 0 || w === 6) ? ' we' : '')
        + (s < today ? ' past' : '')
        + (s === today ? ' today' : '');
      c.innerHTML = '<div class="d">' + day + '</div>' +
        '<div class="n">' + (nameOf(s) || '<span style="color:#4a505c">—</span>') + '</div>';
      cal.appendChild(c);
    }
  }
  render();

  document.getElementById('prev').onclick = function () {
    view.m--; if (view.m === 0) { view.m = 12; view.y--; } render();
  };
  document.getElementById('next').onclick = function () {
    view.m++; if (view.m === 13) { view.m = 1; view.y++; } render();
  };

  if (dates.length) {
    document.getElementById('coverage').textContent = '排班覆盖 ' + md(dates[0]) + ' – ' + md(dates[dates.length - 1]);
  }
  document.getElementById('foot').innerHTML =
    '共 ' + dates.length + ' 天有排班 · 数据来自 duty_list.json<br>' +
    '缺排班的日子显示「未排班」';
})();
</script>
</body>
</html>
